<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wagup Link</title>
<style>
:root{--pri:#172033;--sec:#334155;--bg:#F8FAFC;--card:#FFFFFF;--tx:#111827;--tx2:#64748B;--bd:#E2E8F0;--act:#2563EB;--ok:#16A34A;--er:#DC2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F172A;--card:#172033;--tx:#F1F5F9;--tx2:#94A3B8;--bd:#334155;--pri:#0B1220}}
:root[data-theme="dark"]{--bg:#0F172A;--card:#172033;--tx:#F1F5F9;--tx2:#94A3B8;--bd:#334155;--pri:#0B1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;line-height:1.25;margin:0 0 8px}h2{font-size:19px;margin:24px 0 10px}h3{margin:0}
.w{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri);color:#fff;z-index:5}
.hd{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.btn{min-height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.p{background:var(--act);border-color:var(--act);color:#fff}.btn.g{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.er{color:var(--er)}.btn.sm{min-height:40px;width:auto;font-size:14px}
.row{display:flex;gap:12px;align-items:center}.r2{display:flex;gap:10px;margin-top:12px}.col{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.s{color:var(--tx2);font-size:14px}.hero{background:var(--pri);color:#fff;border-radius:12px;padding:28px 20px}.hero p{color:#CBD5E1;margin:0}
.av{width:48px;height:48px;border-radius:50%;background:var(--sec);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 8px;text-align:center;font:inherit;color:var(--tx);cursor:pointer;min-height:48px}.cat b{display:block;font-size:24px;filter:grayscale(.6)}
.f{display:block;margin-bottom:14px}.f span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx)}
.f textarea{min-height:100px}.f em{color:var(--er);font-size:13px;font-style:normal}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:none}
.tg{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx2)}.tg.ok{color:var(--ok)}.tg.er{color:var(--er)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--tx2);font:inherit;font-size:12px;cursor:pointer}nav button.on{color:var(--act);font-weight:600}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0}.b{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);align-self:flex-start}
.b.me{align-self:flex-end;background:var(--sec);color:#fff;border-color:var(--sec)}.b small{display:block;font-size:11px;opacity:.7;text-align:right}.b img{max-width:100%;border-radius:8px}
.warn{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--sec);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--tx2)}
.mod{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.mod .card{max-width:420px;width:100%;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--pri);color:#fff;padding:10px 16px;border-radius:8px;z-index:30;font-size:14px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.st b{font-size:24px;display:block}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
/* ===== DONNÉES (simulées) : structure prête pour tables SQL ===== */
const CATS=[];let CITIES=[];
const cat=id=>CATS.find(c=>c.id===id);
const SB_URL='https://qefwshejyoywnglamkft.supabase.co',SB_KEY='sb_publishable_He_E87wvQxYNBPOrgaucNg_N71Ljvib';
const sb=supabase.createClient(SB_URL,SB_KEY);
const em=ph=>ph.includes('@')?ph.trim():ph.trim()+'@wagup.app';
const T=x=>new Date(x).getTime();
async function loadAll(){
 const q=t=>sb.from(t).select('*').then(r=>r.data||[]);
 const[jobs,cities,prof,pros,reqs,convs,msgs,bl,rep,pi]=await Promise.all(['jobs','cities','profiles','professionals','requests','conversations','messages','blocks','reports','private_info'].map(q));
 CATS.splice(0,CATS.length,...jobs.filter(j=>j.active).map(j=>({id:j.id,n:j.name,i:j.icon||'•'})));
 CITIES=cities.filter(c=>c.active).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
 const cn=id=>cities.find(c=>c.id===id)?.name||'',pn=id=>prof.find(x=>x.id===id)?.name||'';
 return{users:prof.map(p=>({id:p.id,role:p.role,name:p.name,suspended:p.suspended,phone:pi.find(x=>x.id===p.id)?.phone,proId:p.role==='pro'?p.id:undefined})),
 pros:pros.map(p=>({id:p.id,uid:p.id,name:pn(p.id),cat:p.job_id,cityId:p.city_id,city:cn(p.city_id),zone:p.zone||'',exp:p.exp_years||0,rating:0,n:0,bio:p.bio||'',services:p.services||[],works:[]})),
 reqs:reqs.map(r=>({id:r.id,uid:r.client_id,cat:r.job_id,cityId:r.city_id,city:cn(r.city_id),q:r.quartier||'',title:r.title,desc:r.description||'',budget:r.budget,t:T(r.created_at),imgs:[],status:r.status,chosen:r.chosen_pro_id})),
 convs:convs.map(c=>({id:c.id,reqId:c.request_id,clientId:c.client_id,proId:c.pro_id,msgs:msgs.filter(m=>m.conversation_id===c.id).sort((a,b)=>T(a.created_at)-T(b.created_at)).map(m=>({id:m.id,from:m.sender_id,text:m.body||'',img:m.image_url,t:T(m.created_at),read:!!m.read_at}))})),
 blocks:bl.map(b=>({by:b.blocker_id,target:b.blocked_id})),
 reports:rep.map(r=>({id:r.id,by:pn(r.reporter_id),type:r.target_type,name:r.target_name,reason:r.reason,t:T(r.created_at)}))}}
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dm=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const rid=()=>Math.random().toString(36).slice(2,9);
const Av=({n})=><div className="av">{n[0]}</div>;
const Rt=({p})=>p.n?`★ ${p.rating} (${p.n})`:'Nouveau';
const F=({l,e,as:T='input',...p})=><label className="f"><span>{l}</span><T {...p}/>{e&&<em>{e}</em>}</label>;
const CatSel=p=><F l="Catégorie" as="select" {...p}>{CATS.map(c=><option key={c.id} value={c.id}>{c.n}</option>)}</F>;
const CitySel=p=><F l="Ville" as="select" {...p}><option value="">Choisir une ville…</option>{CITIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</F>;
const ANTI='Ne partagez jamais de code PIN, de mot de passe ou d’informations bancaires dans la messagerie.';

/* ===== ÉCRANS ===== */
const Home=({A})=>{const{go,me}=A;return<>
 <div className="hero"><h1>Trouvez un professionnel près de chez vous.</h1><p>Décrivez votre besoin, échangez avec des professionnels et choisissez celui qui vous convient.</p>
 {!me&&<div className="col"><button className="btn p" onClick={()=>go('auth',{mode:'reg',role:'client'})}>Je cherche un professionnel</button><button className="btn g" onClick={()=>go('auth',{mode:'reg',role:'pro'})}>Je suis professionnel</button></div>}
 {me&&me.role==='client'&&<div className="col"><button className="btn p" onClick={()=>go('pub')}>Publier une demande</button></div>}</div>
 <h2>Nos métiers</h2><div className="grid">{CATS.map(c=><button key={c.id} className="cat" onClick={()=>me?go('list',{cat:c.id}):go('auth',{mode:'reg',role:'client'})}><b>{c.i}</b>{c.n}</button>)}</div>
 <h2>Comment ça marche</h2>{['Décrivez votre besoin','Échangez avec des professionnels','Organisez la rencontre'].map((t,i)=><div key={i} className="card row"><div className="av">{i+1}</div><b>{t}</b></div>)}</>};

const check=(f,role)=>{const e={};if(f.name.trim().length<2)e.name='Nom requis (2 caractères min.)';if(!/^[26]\d{8}$/.test(f.phone))e.phone='9 chiffres, ex. 6XXXXXXXX';if((f.email||role==='pro')&&!/^\S+@\S+\.\S+$/.test(f.email))e.email='E-mail invalide';if(f.pw.length<6)e.pw='6 caractères minimum';if(role==='pro'&&!f.cityId)e.city='Ville requise';return e};
const Auth=({A,v})=>{const[mode,setMode]=useState(v.mode||'login'),[role,setRole]=useState(v.role||'client'),[er,setEr]=useState({}),[msg,setMsg]=useState('');
 const[f,setF]=useState({name:'',phone:'',email:'',pw:'',cat:CATS[0]?.id,cityId:'',zone:''});const s=k=>e=>setF({...f,[k]:e.target.value});
 const go=async()=>{if(mode==='login'){setMsg(await A.login(f.phone,f.pw)||'');return}const e=check(f,role);setEr(e);if(Object.keys(e).length)return;setMsg(await A.register({...f,role})||'')};
 return<><h1>{mode==='login'?'Se connecter':'Créer un compte'}</h1>
 {mode==='reg'&&<div className="r2" style={{marginBottom:16}}>{['client','pro'].map(r=><button key={r} className={'btn'+(role===r?' p':'')} onClick={()=>setRole(r)}>{r==='client'?'Client':'Professionnel'}</button>)}</div>}
 <div className="card">{mode==='reg'&&<F l="Nom" value={f.name} onChange={s('name')} e={er.name}/>}
 <F l={mode==='login'?'Téléphone ou e-mail':'Téléphone'} inputMode="tel" value={f.phone} onChange={s('phone')} e={er.phone}/>
 {mode==='reg'&&<F l={role==='pro'?'E-mail':'E-mail (facultatif)'} type="email" value={f.email} onChange={s('email')} e={er.email}/>}
 <F l="Mot de passe" type="password" value={f.pw} onChange={s('pw')} e={er.pw}/>
 {mode==='reg'&&role==='pro'&&<><CatSel value={f.cat} onChange={s('cat')}/><CitySel value={f.cityId} onChange={s('cityId')} e={er.city}/><F l="Zone / quartier" value={f.zone} onChange={s('zone')}/></>}
 {msg&&<p style={{color:'var(--er)'}}>{msg}</p>}
 <button className="btn p" onClick={go}>{mode==='login'?'Se connecter':'Créer mon compte'}</button>
 <p className="s" style={{textAlign:'center'}}><a href="#" onClick={e=>{e.preventDefault();setMode(mode==='login'?'reg':'login');setMsg('');setEr({})}}>{mode==='login'?'Pas de compte ? S’inscrire':'Déjà inscrit ? Se connecter'}</a></p></div>
 </>};

const Pub=({A,v})=>{const[f,setF]=useState({cat:v.cat||CATS[0]?.id,cityId:'',q:'',title:'',desc:'',budget:'',imgs:[]}),[er,setEr]=useState({});const s=k=>e=>setF({...f,[k]:e.target.value});
 const ok=()=>{const e={};if(!f.q.trim())e.q='Quartier requis';if(!f.cityId)e.city='Ville requise';if(f.title.trim().length<5)e.title='Titre trop court';if(f.desc.trim().length<20)e.desc='Décrivez un peu plus (20 caractères min.)';setEr(e);if(!Object.keys(e).length)A.publish(f)};
 return<><h1>Publier une demande</h1><div className="card"><CatSel value={f.cat} onChange={s('cat')}/><CitySel value={f.cityId} onChange={s('cityId')} e={er.city}/><F l="Quartier" value={f.q} onChange={s('q')} e={er.q}/><F l="Titre de la demande" value={f.title} onChange={s('title')} e={er.title} placeholder="Ex. Installation électrique — Maison"/><F l="Description" as="textarea" value={f.desc} onChange={s('desc')} e={er.desc}/><F l="Budget approximatif (FCFA)" inputMode="numeric" value={f.budget} onChange={s('budget')}/>
 <button className="btn p" style={{marginTop:12}} onClick={ok}>Publier ma demande</button></div></>};
const Done=({A})=><div className="card" style={{textAlign:'center'}}><div style={{fontSize:40,color:'var(--ok)'}}>✓</div><h1>Demande publiée</h1><p className="s">Les professionnels correspondants peuvent maintenant la consulter et vous répondre dans la messagerie.</p><div className="col"><button className="btn p" onClick={()=>A.go('mine')}>Voir mes demandes</button><button className="btn" onClick={()=>A.go('home')}>Retour à l’accueil</button></div></div>;

const ProCard=({p,A})=><div className="card"><div className="row"><Av n={p.name}/><div><b>{p.name}</b><div className="s">{cat(p.cat).n} · {p.city}</div></div></div>
 <div className="s" style={{marginTop:8}}>Zone : {p.zone} · {p.exp} ans d’expérience · <Rt p={p}/></div>
 <div className="r2"><button className="btn" onClick={()=>A.go('pro',{id:p.id})}>Voir le profil</button><button className="btn p" onClick={()=>A.contact(p)}>Contacter</button></div></div>;
const ReqCard=({r,A})=>{const c=A.db.convs.find(x=>x.reqId===r.id&&x.proId===A.me.proId);return<div className="card"><b>{r.title}</b>{r.chosen===A.meId&&<span className="tg ok" style={{marginLeft:8}}>Vous êtes choisi</span>}<div className="s">{cat(r.cat).n} · {r.city}, {r.q} · {dm(r.t)}</div><p style={{margin:'8px 0'}}>{r.desc.slice(0,90)}{r.desc.length>90?'…':''}</p><div className="s">Budget : {r.budget||'non précisé'}</div>
 <div className="r2"><button className="btn" onClick={()=>A.go('req',{id:r.id})}>Voir la demande</button><button className="btn p" onClick={()=>A.interest(r)}>{c?'Ouvrir la discussion':'Je suis intéressé'}</button></div></div>};
const List=({A,v})=>{const{db,me}=A;const[fc,setFc]=useState(v.cat||'all'),[fcity,setFcity]=useState('all');
 if(me.role==='pro'){const rs=db.reqs.filter(r=>r.cat===A.meP.cat&&r.uid!==me.id);return<><h1>Demandes</h1><p className="s">Demandes correspondant à votre métier : {cat(A.meP.cat).n}.</p>{rs.length?rs.map(r=><ReqCard key={r.id} r={r} A={A}/>):<p className="s">Aucune demande pour le moment.</p>}</>}
 const ps=db.pros.filter(p=>(fc==='all'||p.cat===fc)&&(fcity==='all'||p.cityId===+fcity)&&!db.users.find(u=>u.id===p.uid)?.suspended);
 return<><h1>Professionnels</h1><button className="btn p" onClick={()=>A.go('pub',{cat:fc==='all'?undefined:fc})}>Publier une demande</button><div style={{marginTop:12}}><F l="Ville" as="select" value={fcity} onChange={e=>setFcity(e.target.value)}><option value="all">Toutes les villes</option>{CITIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</F></div><div className="tabs" style={{marginTop:0}}>{[{id:'all',n:'Tous'},...CATS].map(c=><button key={c.id} className={'btn sm'+(fc===c.id?' p':'')} onClick={()=>setFc(c.id)}>{c.n}</button>)}</div>{ps.length?ps.map(p=><ProCard key={p.id} p={p} A={A}/>):<p className="s">Aucun professionnel pour ce métier pour le moment.</p>}</>};
const Req=({A,v})=>{const r=A.db.reqs.find(x=>x.id===v.id),cl=A.db.users.find(u=>u.id===r.uid);return<><button className="btn sm" onClick={()=>A.go('list')}>← Retour</button><div className="card" style={{marginTop:12}}><h1>{r.title}</h1><div className="s">{cat(r.cat).n} · {r.city}, {r.q} · {dm(r.t)}</div><p>{r.desc}</p><p><b>Budget :</b> {r.budget||'non précisé'}</p><div className="s">Publié par {cl.name}</div>{r.imgs.map(u=><img key={u} src={u} style={{width:'100%',borderRadius:8,marginTop:8}}/>)}
 <div className="r2"><button className="btn p" onClick={()=>A.interest(r)}>Je suis intéressé</button><button className="btn er" onClick={()=>A.setModal({t:'r',type:'Demande',name:r.title})}>Signaler</button></div></div></>};

const Prof=({A,v,own})=>{const p=A.db.pros.find(x=>x.id===(own?A.me.proId:v.id));const[e,setE]=useState({bio:p.bio,exp:p.exp,zone:p.zone,sv:p.services.join(', ')});
 return<>{!own&&<button className="btn sm" onClick={()=>A.go('list')}>← Retour</button>}<div className="card" style={{marginTop:own?0:12}}><div className="row"><Av n={p.name}/><div><h3>{p.name}</h3><div className="s">{cat(p.cat).n} · {p.city}</div></div></div>
 <p className="s">Zone d’intervention : {p.zone} · {p.exp} ans d’expérience · <Rt p={p}/></p><p>{p.bio||'Aucune présentation pour le moment.'}</p>
 {p.services.length>0&&<><b>Services proposés</b><div style={{margin:'6px 0 12px'}}>{p.services.map(x=><span key={x} className="tg" style={{marginRight:6}}>{x}</span>)}</div></>}
 {p.works.length>0&&<><b>Travaux réalisés</b><div className="grid" style={{marginTop:6}}>{p.works.map((w,i)=><div key={w} style={{background:['#94A3B8','#64748B','#CBD5E1'][i%3],borderRadius:8,height:84,padding:8,fontSize:12,color:'#0F172A',display:'flex',alignItems:'flex-end'}}>{w}</div>)}</div></>}
 {!own&&<div className="r2"><button className="btn p" onClick={()=>A.contact(p)}>Contacter</button><button className="btn er" onClick={()=>A.setModal({t:'r',type:'Profil',name:p.name})}>Signaler</button></div>}</div>
 {own&&<div className="card"><h3 style={{marginBottom:12}}>Modifier mon profil</h3><F l="Présentation" as="textarea" value={e.bio} onChange={x=>setE({...e,bio:x.target.value})}/><F l="Années d’expérience" type="number" min="0" value={e.exp} onChange={x=>setE({...e,exp:x.target.value})}/><F l="Zone d’intervention" value={e.zone} onChange={x=>setE({...e,zone:x.target.value})}/><F l="Services (séparés par des virgules)" value={e.sv} onChange={x=>setE({...e,sv:x.target.value})}/>
 <button className="btn p" onClick={()=>{A.saveProfile({bio:e.bio,exp_years:+e.exp||0,zone:e.zone,services:e.sv.split(',').map(z=>z.trim()).filter(Boolean)})}}>Enregistrer</button></div>}
 {own&&<button className="btn" onClick={A.logout}>Se déconnecter</button>}</>};
const Me=({A})=>A.me.role==='pro'?<Prof A={A} own/>:<><h1>Mon profil</h1><div className="card"><div className="row"><Av n={A.me.name}/><div><b>{A.me.name}</b><div className="s">Compte client</div></div></div></div><button className="btn" style={{marginBottom:10}} onClick={()=>A.go('about')}>À propos</button><button className="btn" onClick={A.logout}>Se déconnecter</button></>;

const ST={open:'Ouverte',chosen:'Professionnel choisi',closed:'Clôturée'};
const Mine=({A})=>{const rs=A.db.reqs.filter(r=>r.uid===A.meId);return<><h1>Mes demandes</h1><button className="btn p" onClick={()=>A.go('pub')}>Publier une demande</button><div style={{marginTop:12}}>{rs.length?rs.map(r=>{const cs=A.db.convs.filter(c=>c.reqId===r.id);return<div key={r.id} className="card"><div className="row" style={{justifyContent:'space-between'}}><b>{r.title}</b><span className={'tg'+(r.status==='chosen'?' ok':'')}>{ST[r.status]||'Ouverte'}</span></div><div className="s">{cat(r.cat)?.n} · {r.city}, {r.q} · {dm(r.t)}</div>
<h3 style={{margin:'12px 0 4px',fontSize:15}}>Professionnels en discussion ({cs.length})</h3>{cs.length?cs.map(c=>{const p=A.db.pros.find(x=>x.id===c.proId),ch=r.chosen===c.proId;return<div key={c.id} style={{borderTop:'1px solid var(--bd)',padding:'10px 0'}}><b>{p?.name||'Professionnel'}</b>{ch&&<span className="tg ok" style={{marginLeft:8}}>Choisi</span>}<div className="s">{p?.zone} · {p?.exp||0} ans d’expérience</div><div className="r2"><button className="btn sm" onClick={()=>A.go('chat',{id:c.id})}>Discuter</button>{p&&<button className="btn sm" onClick={()=>A.go('pro',{id:p.id})}>Profil</button>}{!ch&&<button className="btn p sm" onClick={()=>A.ask('Choisir '+(p?.name||'ce professionnel')+' pour cette demande ?',()=>A.choose(r.id,c.proId))}>Choisir</button>}</div></div>}):<p className="s">Aucune discussion pour le moment. Contactez un professionnel depuis la liste.</p>}</div>}):<p className="s">Vous n’avez pas encore publié de demande.</p>}</div></>};
const info=(A,c)=>{const pro=A.db.pros.find(p=>p.id===c.proId)||{name:'Professionnel',id:c.proId,uid:c.proId},cl=A.db.users.find(u=>u.id===c.clientId),ip=A.me.role==='pro';return{req:A.db.reqs.find(r=>r.id===c.reqId),other:ip?cl.name:pro.name,key:ip?cl.id:pro.id,ouid:ip?cl.id:pro.uid}};
const mine=A=>A.db.convs.filter(c=>A.me.role==='pro'?c.proId===A.me.proId:c.clientId===A.meId);
const unread=(A,c)=>c.msgs.filter(m=>m.from!==A.meId&&!m.read).length;
const Msgs=({A})=>{const cs=mine(A);return<><h1>Messages</h1>{cs.length?cs.map(c=>{const i=info(A,c),l=c.msgs[c.msgs.length-1],u=unread(A,c);return<div key={c.id} className="card" onClick={()=>A.go('chat',{id:c.id})} style={{cursor:'pointer'}}><div className="row" style={{justifyContent:'space-between'}}><b>{i.req.title}</b>{u>0&&<span className="tg" style={{background:'var(--act)',color:'#fff'}}>{u}</span>}</div><div className="s">{i.other}</div><div className="s">{l?(l.from===A.meId?'Vous : ':'')+(l.text||'📷 Photo'):'Aucun message'}</div></div>}):<p className="s">Aucune conversation. Elles démarrent depuis une demande.</p>}</>};
const shrink=f=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);c.toBlob(b=>b?ok(b):ko(),'image/jpeg',0.8)};im.onerror=ko;im.src=URL.createObjectURL(f)});
const Img=({p})=>{const[u,setU]=useState('');useEffect(()=>{let x=true;sb.storage.from('chat-images').createSignedUrl(p,3600).then(r=>{if(x&&r.data)setU(r.data.signedUrl)});return()=>{x=false}},[p]);return u?<img src={u} onClick={()=>window.open(u)}/>:<div className="s">Chargement de l’image…</div>};
const Chat=({A,v})=>{const c=A.db.convs.find(x=>x.id===v.id),i=info(A,c),[t,setT]=useState(''),[busy,setBusy]=useState(false);
 const bl=A.db.blocks.some(b=>(b.by===A.meId&&b.target===i.key)||(b.by===i.ouid&&b.target===A.meId));
 useEffect(()=>{if(unread(A,c))A.markRead(c.id)},[c.msgs.length]);
 const go=()=>{if(t.trim()){A.send(c.id,t.trim());setT('')}};
 const pick=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setBusy(true);try{const b=await shrink(f),p=c.id+'/'+Date.now()+rid()+'.jpg',r=await sb.storage.from('chat-images').upload(p,b,{contentType:'image/jpeg'});if(r.error)throw r.error;await A.send(c.id,'',p)}catch(err){console.error(err);A.say('Envoi de la photo impossible.')}setBusy(false)};
 return<><div className="row" style={{justifyContent:'space-between'}}><button className="btn sm" onClick={()=>A.go('msgs')}>←</button><div style={{flex:1}}><b>{i.req.title}</b><div className="s">{i.other}</div></div></div>
 <div className="r2"><button className="btn sm er" onClick={()=>A.setModal({t:'r',type:'Utilisateur',name:i.other})}>Signaler</button>{!bl&&<button className="btn sm er" onClick={()=>A.ask('Bloquer '+i.other+' ? Vous ne pourrez plus échanger.',()=>A.block(i.key))}>Bloquer</button>}</div>
 <div className="warn" style={{marginTop:12}}>{ANTI}</div>
 <div className="msgs">{c.msgs.map(m=><div key={m.id} className={'b'+(m.from===A.meId?' me':'')}>{m.img&&<Img p={m.img}/>}{m.text}<small>{hm(m.t)}{m.from===A.meId&&(m.read?' · ✓✓ Lu':' · ✓ Non lu')}</small></div>)}</div>
 {bl?<p className="s">Conversation bloquée.</p>:<div className="row"><label className="btn sm" style={{minHeight:48,display:'flex',alignItems:'center',width:'auto'}}>{busy?'…':'📷'}<input type="file" accept="image/*" hidden onChange={pick} disabled={busy}/></label><input value={t} onChange={e=>setT(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="Votre message…" style={{flex:1,minHeight:48,padding:'0 12px',border:'1px solid var(--bd)',borderRadius:8,font:'inherit',background:'var(--card)',color:'var(--tx)'}}/><button className="btn p sm" style={{minHeight:48}} onClick={go}>Envoyer</button></div>}</>};

const Admin=({A})=>{const{db}=A,[tab,setTab]=useState('u'),su=u=>A.ask((u.suspended?'Réactiver':'Suspendre')+' le compte de '+u.name+' ?',()=>A.suspend(u));
 const us=db.users.filter(u=>u.role!=='admin'),S=[['Clients',us.filter(u=>u.role==='client').length],['Professionnels',us.filter(u=>u.role==='pro').length],['Demandes',db.reqs.length],['Conversations',db.convs.length],['Signalements',db.reports.length]];
 const U=({u})=><div className="card row" style={{justifyContent:'space-between'}}><div><b>{u.name}</b> <span className="tg">{u.role==='pro'?cat(db.pros.find(p=>p.id===u.proId)?.cat)?.n:'Client'}</span>{u.suspended&&<span className="tg er">Suspendu</span>}<div className="s">{u.phone}</div></div><button className="btn sm" onClick={()=>su(u)}>{u.suspended?'Réactiver':'Suspendre'}</button></div>;
 return<><h1>Administration</h1><div className="st">{S.map(([l,n])=><div key={l} className="card"><b>{n}</b><span className="s">{l}</span></div>)}</div>
 <div className="tabs">{[['u','Utilisateurs'],['p','Professionnels'],['r','Demandes'],['s','Signalements']].map(([k,l])=><button key={k} className={'btn sm'+(tab===k?' p':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
 {tab==='u'&&us.map(u=><U key={u.id} u={u}/>)}{tab==='p'&&us.filter(u=>u.role==='pro').map(u=><U key={u.id} u={u}/>)}
 {tab==='r'&&db.reqs.map(r=><div key={r.id} className="card"><b>{r.title}</b><div className="s">{cat(r.cat).n} · {r.city}, {r.q} · par {db.users.find(u=>u.id===r.uid)?.name}</div></div>)}
 {tab==='s'&&(db.reports.length?db.reports.map(r=><div key={r.id} className="card"><b>{r.type} : {r.name}</b><div className="s">{r.reason} · signalé par {r.by} · {dm(r.t)}</div></div>):<p className="s">Aucun signalement.</p>)}</>};

const About=()=><><h1>À propos de Wagup Link</h1><div className="card"><p style={{marginTop:0}}>Wagup Link est une plateforme de mise en relation entre clients et professionnels locaux.</p><p>Notre objectif est de simplifier la recherche d’un professionnel en permettant au client de décrire son besoin, d’échanger avec des professionnels et de choisir celui qui lui convient.</p><p style={{marginBottom:0}}>Wagup Link est conçu pour rendre la mise en relation plus simple, pratique et accessible.</p><div className="s" style={{borderTop:'1px solid var(--bd)',paddingTop:12,marginTop:16}}>Fondateur<div style={{color:'var(--tx)',fontWeight:600}}>WAGOUM LOIC</div></div></div></>;
const Modal=({A})=>{const m=A.modal,[rs,setRs]=useState('Contenu inapproprié');if(!m)return null;
 return<div className="mod"><div className="card">{m.t==='c'?<><p>{m.msg}</p><div className="r2"><button className="btn" onClick={()=>A.setModal(null)}>Annuler</button><button className="btn p" onClick={()=>{m.fn();A.setModal(null)}}>Confirmer</button></div></>
 :<><h3>Signaler : {m.name}</h3><F l="Motif" as="select" value={rs} onChange={e=>setRs(e.target.value)}>{['Contenu inapproprié','Arnaque suspectée','Comportement abusif','Autre'].map(x=><option key={x}>{x}</option>)}</F><div className="r2"><button className="btn" onClick={()=>A.setModal(null)}>Annuler</button><button className="btn p" onClick={()=>{A.report(m.type,m.name,rs);A.setModal(null)}}>Envoyer</button></div></>}</div></div>};

/* ===== APP : les fonctions de A = couche « API » à remplacer par des appels serveur ===== */
function App(){
 const[db,setDb]=useState({users:[],pros:[],reqs:[],convs:[],blocks:[],reports:[]}),[meId,setMeId]=useState(null),[ready,setReady]=useState(false),[v,setV]=useState({n:'home'}),[modal,setModal]=useState(null),[toast,setToast]=useState('');
 const me=db.users.find(u=>u.id===meId),meP=me&&db.pros.find(p=>p.id===me.proId);
 const go=(n,p={})=>{setV({n,...p});window.scrollTo(0,0)},say=m=>{setToast(m);setTimeout(()=>setToast(''),2500)},ask=(msg,fn)=>setModal({t:'c',msg,fn});
 const reload=async()=>setDb(await loadAll()),fail=r=>{if(r.error){say('Action impossible. Réessayez.');console.error(r.error);return true}};
 useEffect(()=>{sb.auth.getSession().then(async({data})=>{const u=data.session?.user;await reload();if(u)setMeId(u.id);setReady(true)})},[]);
 useEffect(()=>{if(!meId)return;let w;const rl=()=>{clearTimeout(w);w=setTimeout(reload,300)},vis=()=>{if(!document.hidden)reload()};const ch=sb.channel('live-'+meId);['messages','conversations','requests'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},rl));ch.subscribe();document.addEventListener('visibilitychange',vis);const t=setInterval(reload,30000);return()=>{clearTimeout(w);clearInterval(t);document.removeEventListener('visibilitychange',vis);sb.removeChannel(ch)}},[meId]);
 const A={db,me,meId,meP,go,say,ask,modal,setModal,reload};
 A.logout=async()=>{await sb.auth.signOut();setMeId(null);await reload();go('home')};
 A.login=async(ph,pw)=>{const{data,error}=await sb.auth.signInWithPassword({email:em(ph),password:pw});if(error)return'Téléphone ou mot de passe incorrect.';const{data:p}=await sb.from('profiles').select('role,suspended').eq('id',data.user.id).single();if(p?.suspended){await sb.auth.signOut();return'Ce compte est suspendu.'}await reload();setMeId(data.user.id);go(p?.role==='admin'?'admin':'home');return null};
 A.register=async f=>{const pro=f.role==='pro',{data,error}=await sb.auth.signUp({email:em(f.phone),password:f.pw,options:{data:{role:f.role,name:f.name.trim(),phone:f.phone,email:f.email||'',job_id:pro?+f.cat:null,city_id:pro?+f.cityId:null,zone:f.zone||''}}});if(error)return/registered|already/i.test(error.message)?'Ce numéro est déjà inscrit.':'Inscription impossible : '+error.message;if(!data.session)return'Désactivez « Confirm email » dans Supabase (Authentication).';await reload();setMeId(data.user.id);go(pro?'me':'home');say('Compte créé');return null};
 A.publish=async f=>{const r=await sb.from('requests').insert({client_id:meId,job_id:+f.cat,city_id:+f.cityId,quartier:f.q.trim(),title:f.title.trim(),description:f.desc.trim(),budget:f.budget||null}).select().single();if(fail(r))return;await reload();go('done',{id:r.data.id})};
 A.conv=async(reqId,proId,text)=>{const c=db.convs.find(x=>x.reqId===reqId&&x.proId===proId);if(c)return go('chat',{id:c.id});const req=db.reqs.find(r=>r.id===reqId),r=await sb.from('conversations').insert({request_id:reqId,client_id:req.uid,pro_id:proId}).select().single();if(fail(r))return;if(text)await sb.from('messages').insert({conversation_id:r.data.id,sender_id:meId,body:text});await reload();go('chat',{id:r.data.id})};
 A.interest=r=>A.conv(r.id,meP.id,'Bonjour, je suis intéressé par votre demande « '+r.title+' ». Je suis disponible pour en discuter.');
 A.contact=p=>{if(!me)return go('auth',{mode:'reg',role:'client'});if(me.role!=='client')return say('Réservé aux clients');const r=db.reqs.find(x=>x.uid===meId&&x.cat===p.cat&&x.cityId===p.cityId);if(!r){say('Publiez d’abord une demande pour ce métier et cette ville.');return go('pub',{cat:p.cat})}A.conv(r.id,p.id,null)};
 A.send=async(cid,text,img)=>{const r=await sb.from('messages').insert({conversation_id:cid,sender_id:meId,body:text||null,image_url:img||null});if(!fail(r))reload()};
 A.markRead=async cid=>{await sb.from('messages').update({read_at:new Date().toISOString()}).eq('conversation_id',cid).neq('sender_id',meId).is('read_at',null);reload()};
 A.saveProfile=async d=>{const r=await sb.from('professionals').update(d).eq('id',meId);if(!fail(r)){await reload();say('Profil enregistré')}};
 A.block=async k=>{const r=await sb.from('blocks').insert({blocker_id:meId,blocked_id:k});if(!fail(r))reload()};
 A.report=async(t,n,rs)=>{const r=await sb.from('reports').insert({reporter_id:meId,target_type:t,target_name:n,reason:rs});if(!fail(r))say('Signalement envoyé. Merci.')};
 A.suspend=async u=>{await sb.rpc('admin_set_suspended',{uid:u.id,s:!u.suspended});reload()};
 A.choose=async(rid,pid)=>{const r=await sb.from('requests').update({status:'chosen',chosen_pro_id:pid}).eq('id',rid);if(!fail(r)){await reload();say('Professionnel choisi')}};
 const N=v.n,priv=['list','pub','msgs','chat','me','req','done','mine'].includes(N)&&!me,ub=me&&me.role!=='admin'?mine(A).reduce((s,c)=>s+unread(A,c),0):0;
 const V=priv?<Auth A={A} v={{}}/>:{home:<Home A={A}/>,auth:<Auth A={A} v={v}/>,pub:<Pub A={A} v={v}/>,done:<Done A={A}/>,list:me&&<List A={A} v={v}/>,req:me&&v.id&&<Req A={A} v={v}/>,pro:<Prof A={A} v={v}/>,msgs:me&&<Msgs A={A}/>,mine:me&&<Mine A={A}/>,chat:me&&<Chat A={A} v={v}/>,me:me&&<Me A={A}/>,admin:me&&<Admin A={A}/>,about:<About/>}[N];
 const on={chat:'msgs',pro:'list',req:'list',pub:'list',done:'mine'}[N]||N;
 const tabs=!me?[['Accueil','home'],['Se connecter','auth',{mode:'login'}],['S’inscrire','auth',{mode:'reg'}],['À propos','about']]:me.role==='admin'?[['Admin','admin'],['Accueil','home'],['À propos','about'],['Quitter','out']]:me.role==='pro'?[['Accueil','home'],['Demandes','list'],['Messages'+(ub?' ('+ub+')':''),'msgs'],['Profil','me'],['À propos','about']]:[['Accueil','home'],['Pros','list'],['Demandes','mine'],['Messages'+(ub?' ('+ub+')':''),'msgs'],['Profil','me']];
 return<><header><div className="hd"><span>Wagup Link</span></div></header><div className="w">{ready?V:<p className="s">Chargement…</p>}</div>
 <nav>{tabs.map(([l,k,p])=><button key={l} className={on===k&&!(k==='auth'&&p.mode!==(v.mode||'login'))?'on':''} onClick={()=>k==='out'?A.logout():go(k,p)}>{l}</button>)}</nav><Modal A={A}/>{toast&&<div className="toast">{toast}</div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
